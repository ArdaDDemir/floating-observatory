<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline — Floating Observatory</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.25rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(
            ellipse 80% 50% at 50% 0%,
            rgba(56, 189, 248, 0.12),
            transparent 55%
          ),
          #020617;
        color: #f8fafc;
      }
      .card {
        width: min(100%, 22rem);
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.88);
        padding: 1.75rem 1.5rem;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .gem {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
        transform: rotate(45deg);
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        box-shadow: 0 0 32px rgba(56, 189, 248, 0.45);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: rgba(248, 250, 252, 0.55);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.875rem;
        padding: 0.8rem 1.25rem;
        width: 100%;
        font-size: 0.9rem;
        font-weight: 700;
        color: #020617;
        background: linear-gradient(90deg, #38bdf8, #34d399);
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin-top: 0.85rem;
        font-size: 0.7rem;
        color: rgba(248, 250, 252, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="gem" aria-hidden="true"></div>
      <h1>Island is offline</h1>
      <p>
        No network right now. Your local save still lives on this device — reconnect
        to reopen the full observatory.
      </p>
      <button type="button" id="retry">Try again</button>
      <p class="hint">Tip: open the app once online so the shell can cache.</p>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        if (navigator.onLine) {
          location.href = "/";
        } else {
          location.reload();
        }
      });
      window.addEventListener("online", function () {
        location.href = "/";
      });
    </script>
  </body>
</html>
