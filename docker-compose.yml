# Floating Observatory
# Usage:
#   docker compose up --build
#   open http://localhost:3000

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: floating-observatory:latest
    container_name: floating-observatory
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    # Game state is client-side localStorage — no volume required.
    # Healthcheck hits the HTTP server.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
