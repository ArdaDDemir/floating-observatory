name: ❓ Question
description: How does X work? Not a bug or feature
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Wiki](https://github.com/ArdaDDemir/floating-observatory/wiki) and [FAQ](https://github.com/ArdaDDemir/floating-observatory/wiki/FAQ) first if you can.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you trying to do?
